<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kaspabricks</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      background: radial-gradient(circle at top, #1d3d39 0%, #111 45%);
      color: #fff;
      font-family: 'Segoe UI', system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      line-height: 1.6;
    }

    .container {
      max-width: 700px;
      width: 100%;
      text-align: center;
    }

    img {
      max-width: 100%;
      height: auto;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
      margin-bottom: 32px;
    }

    h1 {
      color: #70C7BA;
      font-size: 2.2rem;
      font-weight: 800;
      margin-bottom: 16px;
      text-shadow: 0 0 20px rgba(112, 199, 186, 0.25);
      letter-spacing: 0.5px;
    }

    p {
      color: #cfcfcf;
      font-size: 1.15rem;
      max-width: 520px;
      margin: 0 auto;
    }

    @media (max-width: 600px) {
      h1 {
        font-size: 1.8rem;
      }
      p {
        font-size: 1.05rem;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <img src="/brick0001.jpg" alt="Kaspabricks">

    <h1>KASPABRICKS IS ON STANDBY — not abandoned.</h1>
    <p>Waiting for a more positive market and overall feeling within the community.</p>
  </div>
</body>
</html>
